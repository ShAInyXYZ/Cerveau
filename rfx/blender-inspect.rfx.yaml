rfx: 1
name: blender-inspect
description: List a scene's objects with type, dimensions, and mesh stats — verify modeling work without rendering
risk: dangerous
modes: [autopilot]
kind: pipeline
card: {fs: [workspace], network: none, subprocess: true}
contract: {max_ms: 120000, output_regex: "OBJ|EMPTY-SCENE"}
params:
  type: object
  properties:
    scene: {type: string}
  required: [scene]
steps:
  - bash: >-
      blender -b {{ params.scene }} --python-expr "import bpy; objs=list(bpy.data.objects); print('EMPTY-SCENE') if not objs else [print('OBJ', o.name, o.type, [round(d,3) for d in o.dimensions], len(o.data.polygons) if o.type=='MESH' else '-') for o in objs]"
