<!-- Planner projects the native plan and sends explicit commands. The server
     owns sequencing and recovery; polling or reopening this panel never
     starts work. No browser-local execution queue or inferred completion. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  body { padding: 10px 12px; }

  .head { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .title { flex:1; min-width:0; font:600 13px/1.5 system-ui; color:var(--text); overflow-wrap:anywhere; }
  .count { font:10px var(--mono); color:var(--muted); white-space:nowrap; }

  /* progress bar — done / failed / remaining */
  .bar { display:flex; height:4px; border-radius:2px; overflow:hidden;
         background:var(--s2); margin-bottom:10px; }
  .bar i { display:block; height:100%; }
  .bar .d { background:var(--ok); } .bar .f { background:var(--err); }
  .bar .r { background:var(--warn); }
  .summary { font:11px system-ui; color:var(--muted); margin-bottom:8px; line-height:1.5; }
  .status { font:10px system-ui; color:var(--muted); margin-top:3px; }
  .partial .status { color:var(--warn); }

  /* the vertical tree */
  .tree { display:flex; flex-direction:column; }
  .node { display:flex; gap:9px; position:relative; padding:0; }
  .spine { position:relative; flex-shrink:0; width:16px; display:flex; justify-content:center; }
  .spine::before { content:''; position:absolute; top:0; bottom:0; width:1px; background:var(--line); opacity:.5; }
  .node:first-child .spine::before { top:9px; }
  .node:last-child .spine::before { bottom:auto; height:9px; }
  .pip { position:relative; z-index:1; margin-top:6px; width:7px; height:7px; border-radius:50%;
         background:var(--s2); box-shadow:inset 0 0 0 1px var(--line2); flex-shrink:0; }
  .pip.done { background:var(--ok); box-shadow:none; }
  .pip.failed { background:var(--err); box-shadow:none; }
  .pip.wip { background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .pip.skipped { background:var(--dim); box-shadow:none; opacity:.6; }
  .pip.partial { background:var(--warn); box-shadow:none; }

  .body { flex:1; min-width:0; padding:0 0 11px; }
  .row { display:flex; align-items:baseline; gap:7px; }
  .num { font:700 9px var(--mono); color:var(--dim); flex-shrink:0; }
  .name { flex:1; min-width:0; font:11.5px system-ui; color:var(--muted);
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node.done .name { color:var(--muted); }
  .node.wip .name { color:var(--text); font-weight:600; }
  .node.failed .name { color:color-mix(in srgb, var(--err) 80%, var(--text)); }
  .node.partial .name { color:var(--muted); }
  .node.wip .body, .node.failed .body { background:var(--s1); border-radius:10px; padding:8px; margin:0 -8px 10px; }
  .node.wip .name, .node.failed .name { white-space:normal; overflow-wrap:anywhere; }
  .step-details { margin-top:5px; color:var(--muted); font:10px/1.5 system-ui; }
  .step-details summary { cursor:pointer; width:fit-content; padding:3px 0; }
  .step-details summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  /* our own check component — the browser default is a white box */
  .sel { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; clip:rect(0 0 0 0); }
  .box { flex-shrink:0; width:15px; height:15px; border-radius:5px; cursor:pointer;
         background:var(--s2); box-shadow:inset 0 0 0 1px var(--line2);
         display:inline-flex; align-items:center; justify-content:center;
         transition:background .12s, box-shadow .12s; }
  .box:hover { box-shadow:inset 0 0 0 1px var(--dim); }
  .box svg { width:10px; height:10px; opacity:0; transform:scale(.6);
             transition:opacity .12s, transform .12s; color:#17140F; }
  .sel:checked + .box { background:var(--accent); box-shadow:none; }
  .sel:checked + .box svg { opacity:1; transform:none; }
  .sel:focus-visible + .box { box-shadow:0 0 0 2px var(--accent); }
  .detail { margin-top:5px; font:11px/1.6 system-ui; color:var(--muted); overflow-wrap:anywhere; }
  .files { margin-top:3px; display:flex; flex-wrap:wrap; gap:4px; }
  .file { font:9px var(--mono); color:var(--dim); padding:1px 5px; border-radius:4px;
          background:var(--s1); box-shadow:inset 0 0 0 1px var(--line); }
  .file.has { color:var(--muted); box-shadow:none; }
  .file.miss { color:var(--muted); }
  .arts { flex-shrink:0; font:9.5px var(--mono); color:var(--dim); }
  .why { margin-top:4px; font:9.5px var(--mono); color:color-mix(in srgb, var(--err) 75%, var(--text));
         white-space:pre-wrap; word-break:break-word; max-height:52px; overflow:auto; }

  .acts { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px; }
  button { display:inline-flex; align-items:center; justify-content:center; gap:5px;
           font:600 10.5px system-ui; padding:7px 6px; border:1px solid var(--line);
           border-radius:999px; background:var(--s2); color:var(--text); cursor:pointer;
           white-space:nowrap; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#17140F; }
  button:hover:not(:disabled) { border-color:var(--line2); filter:brightness(1.12); }
  button:disabled { opacity:.45; cursor:default; }
  button svg { width:12px; height:12px; flex-shrink:0; }
  .wide { grid-column:1/-1; }

  .auto { margin-top:12px; font:11px/1.6 system-ui; color:var(--muted); }

  .note { margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--s1);
          border:1px solid var(--line); font:10.5px var(--mono); color:var(--muted);
          white-space:pre-wrap; word-break:break-word; }
  .note.bad { color:color-mix(in srgb, var(--err) 80%, var(--text)); }
  .note.good { color:var(--ok); }
  .empty { text-align:center; padding:18px 10px; }
  .empty p { font:10.5px var(--mono); color:var(--dim); line-height:1.6; }
</style>

<div id="app"></div>

<script>
  const app = document.getElementById('app');
  const esc = (s) => (s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let plan = null;          // native committed plan {title, steps[], autonomy_budget}
  let statuses = [];        // per-step {status, summary} folded from checkpoints
  let running = false;
  let selected = new Set(); // step indices ticked for a scoped run
  let note = { text: '', tone: '' };
  let kicking = false;   // in-flight latch — `running` lags the 4s poll
  let lastStop = '';   // stop_reason of the last closed turn
  let fileState = {};  // path -> {exists, bytes}, ground truth from disk
  let planState = null; // the core's cursor: per-step verdicts, next, blocked
  const disclosures = new Map();

  function h(html) { app.innerHTML = html; rfx.fit(); }

  // Fold checkpoint events onto plan steps. Checkpoints carry {step, status,
  // summary|detail} — match by title, last write wins (a re-run supersedes).
  // The server reducer is authoritative, including pending and invalidated states.
  function fold(planSteps, states) {
    return planSteps.map((st,i)=>{
      const s=states?.[i];
      const status=s?.status==='passed'?'done':s?.status==='blocked'?'failed':s?.status==='needs_reverify'?'partial':
        s?.status==='pending'?'todo':s?.status==='running'||s?.status==='verifying'?'wip':s?.status??'todo';
      const label=s?.status==='needs_reverify'?'Previously passed · awaiting recheck':
        s?.status==='verifying'?(s?.verdict?.pass?'Rechecking':'Checking'):
        ({done:'Verified',failed:'Blocked',todo:'Not started',wip:'Running',unverified:'Unverified',skipped:'Skipped'}[status]||'Unverified');
      const want=st.files??[];
      return {status,label,summary:s?.verdict?.evidence||s?.reason||'',rev:s?.rev??0,have:want.filter(f=>fileState[f]?.exists).length,want:want.length};
    });
  }

  async function refresh() {
    const s = await rfx.session();
    if (!s.ok) { renderEmpty(s.error || 'no session'); return; }
    running = !!s.running;
    lastStop = ['failed', 'cancelled', 'interrupted', 'suspended'].includes(s.run?.status) ? s.run.status : '';
    if (planState?.plan_event_id !== s.planState?.plan_event_id) { selected.clear(); disclosures.clear(); }
    plan = s.plan && s.plan.steps ? s.plan : null;
    if (!plan) { renderEmpty('No committed plan in this session yet.\n\nAgree a plan in Discussion — cerveau calls commit_plan and it appears here as a tree.'); return; }
    const declared = [...new Set(plan.steps.flatMap((st) => st.files ?? []))];
    if (declared.length) {
      const fr = await rfx.files(declared);
      if (fr.ok) {
        fileState = {};
        for (const f of fr.files) fileState[f.path] = f;
      }
    }
    planState=s.planState;
    statuses=fold(plan.steps,planState?.steps);
    render();
  }

  function renderEmpty(msg) {
    plan = null;
    h(`<div class="empty"><p>${esc(msg)}</p></div>`);
  }

  // The server owns dependency order, including failed and invalidated work.
  const nextTodo = () => Number.isInteger(planState?.blocked) && planState.blocked >= 0 ? planState.blocked : Number.isInteger(planState?.next) ? planState.next : -1;
  const allDone = () => statuses.length > 0 && statuses.every((x) => x.status === 'done');
  // a turn killed by the time/iteration guard did REAL work but wrote no
  // checkpoint — that is "interrupted", not "failed" and not "nothing".
  // ANY guard stop (time, iterations, repeated tool errors, loop detection)
  // means the turn ended WITHOUT completing the step — real work may have
  // landed, and no checkpoint was written. That is "interrupted", never
  // silence. Distinguishing the reason only changes the wording.
  const interrupted = () => !!lastStop && lastStop !== 'final_answer';
  const stopKind = () => {
    if (lastStop === 'cancelled') return 'was cancelled';
    if (lastStop === 'interrupted') return 'was interrupted';
    if (lastStop === 'suspended') return 'needs review';
    if (lastStop === 'failed') return 'failed';
    if (/time/.test(lastStop)) return 'ran out of time';
    if (/error/.test(lastStop)) return 'hit repeated tool errors';
    if (/iter/.test(lastStop)) return 'hit its iteration limit';
    if (/loop|repeat/.test(lastStop)) return 'was stopped by loop detection';
    return 'stopped early (' + lastStop + ')';
  };

  function render() {
    const done = statuses.filter((x) => x.status === 'done').length;
    const failed = statuses.filter((x) => x.status === 'failed').length;
    const total = statuses.length || 1;
    const recheck = statuses.filter(x=>x.status==='partial').length;
    const counts = [['done','verified'],['partial','awaiting recheck'],['failed','blocked'],['wip','active'],['todo','not started'],['unverified','unverified'],['skipped','skipped']]
      .map(([status,label])=>[statuses.filter(x=>x.status===status).length,label]).filter(([n])=>n>0).map(([n,label])=>`${n} ${label}`).join(' · ');

    const nodes = plan.steps.map((st, i) => {
      let cls = statuses[i].status;
      const files = (st.files ?? []).map((f) => {
        const ok = fileState[f]?.exists;
        const kb = ok ? ' \u00b7 ' + Math.max(1, Math.round(fileState[f].bytes / 1024)) + 'k' : '';
        return `<span class="file ${ok ? 'has' : 'miss'}" data-tip="${ok ? 'exists' + kb : 'not written yet'}">${esc(f)}</span>`;
      }).join('');
      const why = statuses[i].status === 'failed' && statuses[i].summary
        ? `<div class="why">${esc(statuses[i].summary)}</div>` : '';
      return `<div class="node ${cls}">
        <span class="spine"><span class="pip ${cls}"></span></span>
        <div class="body">
          <div class="row">
            <span class="num">${String(i + 1).padStart(2, '0')}</span>
            <span class="name" data-tip="${esc(st.detail || st.title)}">${esc(st.title)}</span>
            <input class="sel" type="checkbox" aria-label="Select step ${i+1}" id="sel${i}" data-i="${i}" ${selected.has(i) ? 'checked' : ''}>
            <label class="box" for="sel${i}" data-tip="include in a scoped run">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </label>
          </div>
          <div class="status">${esc(statuses[i].label)}</div>
          <details class="step-details" data-step="${i}" ${(disclosures.get(i) ?? cls === 'wip') ? 'open' : ''}>
            <summary>Details${statuses[i].want ? ` · ${statuses[i].have}/${statuses[i].want} files present` : ''}</summary>
            ${st.detail ? `<div class="detail">${esc(st.detail)}</div>` : ''}
            ${files ? `<div class="files">${files}</div>` : ''}
          </details>
          ${why}
        </div>
      </div>`;
    }).join('');

    const selCount = selected.size;
    h(`<div class="head">
        <span class="title" data-tip="${esc(plan.title)}">${esc(plan.title)}</span>
        <span class="count">${done}/${statuses.length} verified</span>
      </div>
      <div class="summary">${esc(counts)}</div>
      <div class="bar">
        <i class="d" style="width:${(done / total) * 100}%"></i>
        <i class="r" style="width:${(recheck / total) * 100}%"></i>
        <i class="f" style="width:${(failed / total) * 100}%"></i>
      </div>
      <div class="tree">${nodes}</div>
      <div class="acts">
        <button id="next" ${running || nextTodo() < 0 ? 'disabled' : ''}
          data-tip="${interrupted() ? 'the last step ' + stopKind() + ' — continue it from where it stopped' : 'ask cerveau to do the next unfinished step'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${interrupted() ? '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>' : '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'}</svg>
          ${planState?.blocked>=0 ? `Recover step ${nextTodo()+1}` : interrupted() ? 'Resume step' : 'Next step'}
        </button>
        <button id="sel" ${running || !selCount ? 'disabled' : ''}
          data-tip="run the ticked steps on the server; include unfinished prerequisites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          Selected${selCount ? ' (' + selCount + ')' : ''}
        </button>
        <button class="primary wide" id="all" ${running || allDone() ? 'disabled' : ''}
          data-tip="run the remaining plan end to end (native autopilot)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9z"/></svg>
          Run whole plan
        </button>
      </div>
      <div class="auto">Selected and whole-plan runs continue on the server, even if this panel closes.</div>
      ${interrupted() && !running ? `<div class="note">Work is preserved. Recover/Resume runs one step and its required rechecks. To continue the remaining plan automatically, use “Recover step and continue plan” in chat.</div>` : ''}
      ${note.text ? `<div class="note ${note.tone}">${esc(note.text)}</div>` : ''}`);

    for (const box of app.querySelectorAll('.sel')) {
      box.onchange = () => {
        const i = +box.getAttribute('data-i');
        if (box.checked) selected.add(i); else selected.delete(i);
        render();
      };
    }
    for (const disclosure of app.querySelectorAll('.step-details')) {
      // Record intentional input synchronously. Native toggle events are
      // queued and can otherwise race a polling render that replaces nodes.
      disclosure.querySelector('summary').onclick = event => {
        event.preventDefault();
        disclosure.open = !disclosure.open;
        disclosures.set(+disclosure.dataset.step, disclosure.open);
        rfx.fit();
      };
      disclosure.ontoggle = () => { if (disclosure.isConnected) rfx.fit(); };
    }
    document.getElementById('next').onclick = () => kick('next');
    document.getElementById('sel').onclick = () => kick('selected');
    document.getElementById('all').onclick = () => kick('all');
  }

  // Explicit commands only: polling never starts or retries work.
  async function kick(scope) {
    if (running || kicking) return;
    kicking = true;
    try { await doKick(scope); } finally { kicking = false; }
  }

  async function doKick(scope) {
    const planID = planState?.plan_event_id;
    if (!planID) { setNote('Refresh the committed plan before running.', 'bad'); return; }
    // Steps are RUN, not described.
    //
    // This used to compose a sentence — "Continue the committed plan: do step
    // 3 only, then stop and report" — and post it as an ordinary turn. The
    // core had no idea a step was requested: nothing bound the run to step 3,
    // nothing verified step 3, and no checkpoint was written, so this panel
    // had to infer progress from which files happened to exist. A surface
    // that looks like it controls execution, sitting on a core with no
    // concept of a step, is what made the plan decoration.
    //
    // rfx.runStep() names the step. The core scopes the run, executes it,
    // runs that step's own declared check, and records the verdict.
    let steps = [];
    if (scope === 'next') {
      const i = nextTodo();
      if (i < 0) { setNote('Nothing left to do.', 'good'); return; }
      steps = [i];
    } else if (scope === 'selected') {
      steps = [...selected].sort((a, b) => a - b);
      if (!steps.length) return;
    } else {
      steps = null; // whole plan: let the core walk its own cursor
    }

    setNote(steps && steps.length === 1 ? `running step ${steps[0] + 1}…` : 'running…', '');

    if (steps === null) {
      const r = await rfx.runPlan(planID);
      if (!r.ok) setNote(r.error || 'could not start the run', 'bad');
      return;
    }
    const r = scope === 'selected'
      ? await rfx.runSelected(steps, planID)
      : await rfx.runStep(steps[0], false, planID);
    if (!r.ok) setNote(r.error || 'The run stopped before its checks passed. Inspect the step status before retrying.', 'bad');
    await refresh();
  }

  // Re-run one step, explicitly, as a revision: the check passed but a human
  // can see it is wrong.
  async function revise(i) {
    if (running || kicking) return;
    kicking = true;
    try {
      setNote(`revising step ${i + 1}…`, '');
      const r = await rfx.runStep(i, true, planState?.plan_event_id);
      if (!r.ok) setNote(r.error || 'could not revise', 'bad');
    } finally { kicking = false; }
  }

  function setNote(text, tone) { note = { text, tone }; if (plan) render(); }

  refresh();
  setInterval(refresh, 4000);
</script>
