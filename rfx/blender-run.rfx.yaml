rfx: 1
name: blender-run
description: Run a workspace bpy modeling script against a scene file; the script must save the scene itself
risk: dangerous
modes: [autopilot]
kind: pipeline
card: {fs: [workspace], network: none, subprocess: true}
contract: {max_ms: 300000}
params:
  type: object
  properties:
    scene: {type: string}
    script: {type: string}
  required: [scene, script]
steps:
  # ORDER MATTERS: --python-exit-code must precede --python (Blender parses
  # CLI args in order; after --python it's silently ignored — dogfooded).
  - bash: >-
      blender -b {{ params.scene }} --python-exit-code 1 --python {{ params.script }}
