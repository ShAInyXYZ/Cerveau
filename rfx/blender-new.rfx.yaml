rfx: 1
name: blender-new
description: Create a fresh empty Blender scene file in the workspace (factory startup, no default cube)
risk: dangerous
modes: [autopilot]
kind: pipeline
card: {fs: [workspace], network: none, subprocess: true}
contract: {max_ms: 120000}
params:
  type: object
  properties:
    scene: {type: string}
  required: [scene]
steps:
  - bash: >-
      blender -b --factory-startup --python-expr "import bpy; bpy.ops.object.select_all(action='SELECT'); bpy.ops.object.delete(); bpy.ops.wm.save_as_mainfile(filepath={{ params.scene }})"
