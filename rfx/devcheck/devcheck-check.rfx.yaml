rfx: 1
name: devcheck-check
description: Check explicit CSS element assertions in a local app; return exact passed/failed facts and a retained evidence receipt, without visual guessing
kind: exec
risk: sensitive
modes: [autopilot]
ingress_cap: 8000
argv: [/usr/bin/env, rfx-devcheck, check]
timeout: 40s
card:
  fs: [workspace]
  network: [localhost, 127.0.0.1]
  env: [CERVEAU_PLAYWRIGHT_MODULE, CERVEAU_CHROMIUM]
  subprocess: true
params:
  type: object
  additionalProperties: false
  properties:
    url: {type: string, maxLength: 2048, description: 'Explicit http://localhost:PORT or http://127.0.0.1:PORT local app; port 1024..65535, no credentials'}
    checks:
      type: array
      minItems: 1
      maxItems: 20
      items:
        type: object
        additionalProperties: false
        properties:
          selector: {type: string, maxLength: 300, description: 'CSS only; text/visible checks require exactly one matching element'}
          kind: {type: string, enum: [exists, visible, text, count]}
          expected:
            description: 'Boolean for exists/visible; exact trimmed and whitespace-normalized string for text; integer for count'
            anyOf:
              - {type: boolean}
              - {type: string, maxLength: 500}
              - {type: integer, minimum: 0, maximum: 1000}
        required: [selector, kind, expected]
    wait_ms: {type: integer, minimum: 0, maximum: 1500}
  required: [url, checks]
